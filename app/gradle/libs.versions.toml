[versions]
kotlin = "2.4.10"
android = "9.3.1"
android-tools = "32.3.1"
ksp = "2.3.11"
rikka = "1.3.0"
parcelablelist = "2.0.1"
navigation = "2.9.8"
navigation3 = "1.1.6"
navigationevent = "1.1.2"
libsu = "6.0.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
room = "2.8.4"
miuix = "0.9.3"
hiddenapibypass = "6.1"
composeBom = "2026.08.00"
wire = "6.4.5"

[libraries]
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.85" }
commons-compress = { module = "org.apache.commons:commons-compress", version = "1.28.0" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
markwon-core = { module = "io.noties.markwon:core", version = "4.6.2" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
xz = { module = "org.tukaani:xz", version = "1.12" }

# AndroidX
activity = { module = "androidx.activity:activity", version = "1.13.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version = "1.9.0" }
navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version = "2.10.0" }
